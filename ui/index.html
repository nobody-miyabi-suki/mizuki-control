<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizuki Control</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #c084fc;
        }

        button {
            padding: 10px 20px;
            background: #222;
            color: white;
            border: 1px solid #c084fc;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<script>
    const events = new EventSource("/event");

    events.onmessage = (event) => {
        const data = JSON.parse(event.data);

        document.getElementById("cpu").textContent = data.cpu;
        document.getElementById("ram").textContent = data.ram;
    };

    events.onerror = () => {
        console.log("Connection to Mizuki event stream lost.");
    };
</script>
<body>
    <h1>Mizuki Control</h1>
    <p>FastAPI HTML test page</p>

    <h2>System Monitor</h2>

    <p>CPU: <span id="cpu">-</span>%</p>
    <p>RAM: <span id="ram">-</span>%</p>

    <button onclick="alert('Mizuki says hello!')">
        Click me
    </button>
</body>
</html>
